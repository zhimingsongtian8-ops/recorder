<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>議事録音声レコーダー</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; max-width: 500px; margin: auto; background: #f4f6f8; }
    .card { border-radius: 12px; padding: 16px; margin-bottom: 12px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
    button { padding: 14px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; margin-top: 5px; }
    .btn-start { background-color: #28a745; color: white; }
    .btn-pause { background-color: #ffc107; color: #333; }
    .btn-stop { background-color: #dc3545; color: white; }
    input[type="text"] { width: 100%; padding: 10px; box-sizing: border-box; margin-top: 4px; font-size: 15px; border: 1px solid #ccc; border-radius: 6px; }
    #status { margin-top: 10px; font-weight: bold; font-size: 15px; text-align: center; }
    #log { background: #fafafa; border: 1px solid #e1e4e8; border-radius: 6px; height: 160px; overflow-y: auto; padding: 10px; margin-top: 8px; white-space: pre-wrap; font-size: 14px; line-height: 1.5; }
    .btn-group { display: flex; gap: 8px; }
    .btn-group button { flex: 1; }
  </style>
</head>
<body>

  <h2 style="text-align: center; margin: 5px 0 15px;">🎙️ 議事録レコーダー</h2>

  <!-- 会議・端末設定 -->
  <div class="card">
    <label><strong>会議名・案件名:</strong></label>
    <input type="text" id="meetingName" placeholder="例: 定例ミーティング">

    <label style="margin-top: 10px; display:block;"><strong>端末名（発言者）:</strong></label>
    <input type="text" id="deviceName" placeholder="例: 会議室マイク、山田">
  </div>

  <!-- 操作部 -->
  <div class="card">
    <button id="recordBtn" class="btn-start" onclick="toggleRecording()">録音開始</button>
    <div id="controlGroup" class="btn-group" style="display: none;">
      <button id="pauseBtn" class="btn-pause" onclick="togglePause()">一時停止</button>
      <button class="btn-stop" onclick="stopRecording()">終了・保存</button>
    </div>

    <div id="status">待機中</div>
    
    <label style="margin-top: 12px; display:block; font-size: 13px;"><strong>リアルタイム認識:</strong></label>
    <div id="log">話した内容がここに表示されます...</div>
  </div>

  <script>
    let recognition;
    let isRecording = false;
    let isPaused = false;
    let wakeLock = null;
    let targetGasUrl = "";
    let authToken = "";

    let textBuffer = [];
    let silenceTimer = null;

    // 起動時のURLパラメータ取得と初期化
    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const qGas = urlParams.get('gas');
      const qToken = urlParams.get('token');

      if (qGas) localStorage.setItem('target_gas_url', qGas);
      if (qToken) localStorage.setItem('auth_token', qToken);

      targetGasUrl = localStorage.getItem('target_gas_url') || "";
      authToken = localStorage.getItem('auth_token') || "";

      const savedDevice = localStorage.getItem('meeting_device_name');
      if (savedDevice) document.getElementById('deviceName').value = savedDevice;
    };

    document.getElementById('deviceName').addEventListener('input', (e) => {
      localStorage.setItem('meeting_device_name', e.target.value);
    });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      alert("非対応ブラウザです。iPhoneはSafari、Android・PCはGoogle Chromeをご利用ください。");
    } else {
      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = true;
      recognition.interimResults = false;

      recognition.onresult = function(event) {
        if (isPaused) return;

        const transcript = event.results[event.results.length - 1][0].transcript.trim();
        if (transcript.length > 0) {
          const logDiv = document.getElementById('log');
          logDiv.textContent += transcript + " ";
          logDiv.scrollTop = logDiv.scrollHeight;

          // バッファに蓄積
          textBuffer.push(transcript);

          // 無音3秒判定（3秒発言が途切れたら文章をまとめて送信）
          clearTimeout(silenceTimer);
          silenceTimer = setTimeout(() => {
            flushBuffer();
          }, 3000);
        }
      };

      recognition.onend = function() {
        if (isRecording && !isPaused) {
          setTimeout(() => {
            try { if (isRecording && !isPaused) recognition.start(); } catch(e){}
          }, 200);
        }
      };
    }

    // まとめて送信する処理
    function flushBuffer() {
      if (textBuffer.length === 0) return;
      const combinedText = textBuffer.join('、');
      textBuffer = [];

      const meeting = document.getElementById('meetingName').value || '通常会議';
      const device = document.getElementById('deviceName').value || '未設定端末';
      const status = document.getElementById('status');

      fetch(targetGasUrl, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({
          token: authToken,
          meetingName: meeting,
          deviceName: device,
          text: combinedText
        })
      })
      .then(() => {
        status.innerHTML = "<span style='color:green;'>● 録音中（SS記録済）</span>";
      })
      .catch(() => {
        status.innerHTML = "<span style='color:red;'>● SS記録失敗</span>";
      });
    }

    async function toggleRecording() {
      if (!targetGasUrl) {
        alert("接続先シートが未設定です。シートのQRコードを再度読み取ってください。");
        return;
      }
      try {
        await navigator.mediaDevices.getUserMedia({ audio: true });
        if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');

        recognition.start();
        isRecording = true;
        isPaused = false;

        document.getElementById('recordBtn').style.display = 'none';
        document.getElementById('controlGroup').style.display = 'flex';
        document.getElementById('status').innerHTML = "<span style='color:green;'>● 録音中...</span>";
        document.getElementById('log').textContent = "";
      } catch(e) {
        alert("マイクの使用が許可されませんでした。");
      }
    }

    function togglePause() {
      const btn = document.getElementById('pauseBtn');
      if (!isPaused) {
        isPaused = true;
        recognition.stop();
        flushBuffer();
        btn.innerText = "再開";
        btn.className = "btn-start";
        document.getElementById('status').innerText = "⏸️ 一時停止中";
      } else {
        isPaused = false;
        recognition.start();
        btn.innerText = "一時停止";
        btn.className = "btn-pause";
        document.getElementById('status').innerHTML = "<span style='color:green;'>● 録音中...</span>";
      }
    }

    function stopRecording() {
      isRecording = false;
      isPaused = false;
      recognition.stop();
      flushBuffer();
      if (wakeLock) { wakeLock.release(); wakeLock = null; }

      document.getElementById('controlGroup').style.display = 'none';
      document.getElementById('recordBtn').style.display = 'block';
      document.getElementById('status').innerText = "停止中（保存完了）";
    }
  </script>
</body>
</html>
