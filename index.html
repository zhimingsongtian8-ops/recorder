<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>議事録音声レコーダー</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; max-width: 500px; margin: auto; background: #f4f6f8; }
    .card { border-radius: 12px; padding: 16px; margin-bottom: 12px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
    button { padding: 14px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; margin-top: 5px; }
    .btn-start { background-color: #28a745; color: white; }
    .btn-pause { background-color: #ffc107; color: #333; }
    .btn-stop { background-color: #dc3545; color: white; }
    input[type="text"] { width: 100%; padding: 10px; box-sizing: border-box; margin-top: 4px; font-size: 15px; border: 1px solid #ccc; border-radius: 6px; }
    input[readonly] { background-color: #e9ecef; color: #495057; font-weight: bold; }
    #status { margin-top: 10px; font-weight: bold; font-size: 15px; text-align: center; }
    #log { background: #fafafa; border: 1px solid #e1e4e8; border-radius: 6px; height: 140px; overflow-y: auto; padding: 10px; margin-top: 8px; white-space: pre-wrap; font-size: 14px; line-height: 1.5; }
    .btn-group { display: flex; gap: 8px; }
    .btn-group button { flex: 1; }
    .guidance { font-size: 12px; color: #666; margin-top: 5px; line-height: 1.4; }

    /* 音量レベルメーター */
    .meter-container { height: 8px; background: #e9ecef; border-radius: 4px; overflow: hidden; margin-top: 12px; }
    .meter-bar { height: 100%; width: 0%; background: #28a745; transition: width 0.1s ease; }
  </style>
</head>
<body>

  <h2 style="text-align: center; margin: 5px 0 15px;">🎙️ 会議マイク端末</h2>

  <!-- 会議・参加者設定 -->
  <div class="card">
    <label><strong>会議タイトル:</strong></label>
    <input type="text" id="meetingName" readonly>

    <label style="margin-top: 10px; display:block;"><strong>あなたの氏名（必須）:</strong></label>
    <input type="text" id="userName" placeholder="例: 山田 太郎">
    <div class="guidance">※入力後、「録音開始」を押して自分の席の前に置いてください。</div>
  </div>

  <!-- 操作部 -->
  <div class="card">
    <button id="recordBtn" class="btn-start" onclick="toggleRecording()">録音開始</button>
    <div id="controlGroup" class="btn-group" style="display: none;">
      <button id="pauseBtn" class="btn-pause" onclick="togglePause()">一時停止</button>
      <button class="btn-stop" onclick="stopRecording()">マイク停止</button>
    </div>

    <!-- 音声入力レベルメーター -->
    <div class="meter-container">
      <div id="meterBar" class="meter-bar"></div>
    </div>

    <div id="status">待機中</div>
    
    <label style="margin-top: 12px; display:block; font-size: 13px;"><strong>あなたの音声認識プレビュー:</strong></label>
    <div id="log">話した内容がここに表示されます...</div>
  </div>

  <script>
    let recognition;
    let isRecording = false;
    let isPaused = false;
    let wakeLock = null;
    let targetGasUrl = "";
    let authToken = "";

    // 高度バッファ ＆ キュー
    let textBuffer = [];
    let silenceTimer = null;
    let watchdogTimer = null;
    let heartbeatTimer = null;
    let pendingRetryQueue = []; // オフライン再送キュー

    // オーディオメーター用
    let audioContext = null;
    let analyser = null;
    let microphoneStream = null;
    let animFrameId = null;

    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const qGas = urlParams.get('gas');
      const qToken = urlParams.get('token');
      const qMeeting = urlParams.get('meeting');

      if (qGas) localStorage.setItem('target_gas_url', qGas);
      if (qToken) localStorage.setItem('auth_token', qToken);

      targetGasUrl = localStorage.getItem('target_gas_url') || "";
      authToken = localStorage.getItem('auth_token') || "";

      if (qMeeting) {
        document.getElementById('meetingName').value = decodeURIComponent(qMeeting);
      } else {
        document.getElementById('meetingName').value = "通常会議";
      }

      const savedUser = localStorage.getItem('meeting_user_name');
      if (savedUser) document.getElementById('userName').value = savedUser;
    };

    document.getElementById('userName').addEventListener('input', (e) => {
      localStorage.setItem('meeting_user_name', e.target.value);
    });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      alert("非対応ブラウザです。iPhoneはSafari、Android・PCはChromeをご利用ください。");
    } else {
      setupSpeechRecognition();
    }

    function setupSpeechRecognition() {
      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = true;
      recognition.interimResults = false;

      recognition.onresult = function(event) {
        if (isPaused) return;

        const transcript = event.results[event.results.length - 1][0].transcript.trim();
        if (transcript.length > 0) {
          const logDiv = document.getElementById('log');
          logDiv.textContent += transcript + " ";
          logDiv.scrollTop = logDiv.scrollHeight;

          textBuffer.push(transcript);

          // 無音2.5秒でまとめ送信
          clearTimeout(silenceTimer);
          silenceTimer = setTimeout(() => {
            flushBuffer();
          }, 2500);
        }
      };

      recognition.onend = function() {
        if (isRecording && !isPaused) {
          setTimeout(() => {
            try { if (isRecording && !isPaused) recognition.start(); } catch(e){}
          }, 150);
        }
      };
    }

    // ★【精度向上】文末をインテリジェントに判定して自然な日本語に結合
    function formatIntelligentSentence(words) {
      return words.map(w => {
        w = w.trim();
        if (/(です|ます|でした|ました|だ|である|でしょうか|ね|よ|ぞ)$/.test(w) || /[。！？]$/.test(w)) {
          return w.replace(/[。！？]?$/, '。');
        }
        return w + '、';
      }).join('').replace(/、$/, '。');
    }

    // スプレッドシート送信 ＆ 再送キュー処理
    function flushBuffer() {
      if (textBuffer.length === 0 && pendingRetryQueue.length === 0) return;

      let combinedText = "";
      if (textBuffer.length > 0) {
        combinedText = formatIntelligentSentence(textBuffer);
        textBuffer = [];
      }

      // 未送信キューがあれば合体
      if (pendingRetryQueue.length > 0) {
        combinedText = pendingRetryQueue.join(' ') + ' ' + combinedText;
        pendingRetryQueue = [];
      }

      const meeting = document.getElementById('meetingName').value;
      const user = document.getElementById('userName').value || '匿名参加者';
      const status = document.getElementById('status');

      fetch(targetGasUrl, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({
          token: authToken,
          meetingName: meeting,
          userName: user,
          text: combinedText,
          type: 'speech'
        })
      })
      .then(() => {
        status.innerHTML = "<span style='color:green;'>● 録音中（送信完了）</span>";
      })
      .catch((err) => {
        // オフライン・失敗時はキューに退避して次回自動再送
        pendingRetryQueue.push(combinedText);
        status.innerHTML = "<span style='color:orange;'>● 一時保存中（電波復旧時に再送）</span>";
      });
    }

    // 定期生存信号（ハートビート：25秒おき）
    function sendHeartbeat() {
      if (!isRecording || isPaused) return;
      const user = document.getElementById('userName').value || '匿名参加者';

      fetch(targetGasUrl, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({
          token: authToken,
          userName: user,
          type: 'heartbeat'
        })
      }).catch(()=>{});

      // 溜まっている再送キューがあればついでに送信
      if (pendingRetryQueue.length > 0) {
        flushBuffer();
      }
    }

    // ★【動作安定】番犬タイマー（iOS等のサイレントフリーズを検知して強制復帰）
    function startWatchdog() {
      watchdogTimer = setInterval(() => {
        if (isRecording && !isPaused) {
          try {
            recognition.start();
          } catch(e) {
            // すでに動いていれば何もしない
          }
        }
      }, 4000);
    }

    // ★【視覚的安心】マイク入力レベルメーター
    async function startAudioMeter(stream) {
      try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        const source = audioContext.createMediaStreamSource(stream);
        source.connect(analyser);

        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        const meterBar = document.getElementById('meterBar');

        function updateMeter() {
          if (!isRecording) {
            meterBar.style.width = '0%';
            return;
          }
          analyser.getByteFrequencyData(dataArray);
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
          let average = sum / dataArray.length;
          let percent = Math.min(100, Math.max(0, (average - 10) * 2));
          meterBar.style.width = percent + '%';
          animFrameId = requestAnimationFrame(updateMeter);
        }
        updateMeter();
      } catch(e) {
        console.log("AudioMeter Error:", e);
      }
    }

    async function toggleRecording() {
      const user = document.getElementById('userName').value.trim();
      if (!user) {
        alert("あなたの「氏名」を入力してください。");
        return;
      }
      if (!targetGasUrl) {
        alert("接続先情報がありません。QRコードを再読み取りしてください。");
        return;
      }

      try {
        microphoneStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');

        recognition.start();
        isRecording = true;
        isPaused = false;

        startAudioMeter(microphoneStream);
        startWatchdog();
        heartbeatTimer = setInterval(sendHeartbeat, 25000);
        sendHeartbeat(); // 初回パルス送信

        document.getElementById('recordBtn').style.display = 'none';
        document.getElementById('controlGroup').style.display = 'flex';
        document.getElementById('status').innerHTML = "<span style='color:green;'>● 録音中...</span>";
        document.getElementById('log').textContent = "";
      } catch(e) {
        alert("マイクの使用が許可されませんでした。");
      }
    }

    function togglePause() {
      const btn = document.getElementById('pauseBtn');
      if (!isPaused) {
        isPaused = true;
        recognition.stop();
        flushBuffer();
        btn.innerText = "再開";
        btn.className = "btn-start";
        document.getElementById('status').innerText = "⏸️ 一時停止中";
        document.getElementById('meterBar').style.width = '0%';
      } else {
        isPaused = false;
        recognition.start();
        btn.innerText = "一時停止";
        btn.className = "btn-pause";
        document.getElementById('status').innerHTML = "<span style='color:green;'>● 録音中...</span>";
      }
    }

    function stopRecording() {
      isRecording = false;
      isPaused = false;
      recognition.stop();
      flushBuffer();

      if (wakeLock) { wakeLock.release(); wakeLock = null; }
      if (watchdogTimer) clearInterval(watchdogTimer);
      if (heartbeatTimer) clearInterval(heartbeatTimer);
      if (animFrameId) cancelAnimationFrame(animFrameId);
      if (audioContext) { audioContext.close(); audioContext = null; }
      if (microphoneStream) {
        microphoneStream.getTracks().forEach(t => t.stop());
        microphoneStream = null;
      }

      document.getElementById('controlGroup').style.display = 'none';
      document.getElementById('recordBtn').style.display = 'block';
      document.getElementById('meterBar').style.width = '0%';
      document.getElementById('status').innerText = "停止中";
    }
  </script>
</body>
</html>
