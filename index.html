<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>議事録音声レコーダー</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; max-width: 500px; margin: auto; background: #f4f6f8; }
    .card { border-radius: 12px; padding: 16px; margin-bottom: 12px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
    button { padding: 14px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; margin-top: 5px; }
    .btn-start { background-color: #28a745; color: white; }
    .btn-pause { background-color: #ffc107; color: #333; }
    .btn-stop { background-color: #dc3545; color: white; }
    input[type="text"] { width: 100%; padding: 10px; box-sizing: border-box; margin-top: 4px; font-size: 15px; border: 1px solid #ccc; border-radius: 6px; }
    input[readonly] { background-color: #e9ecef; color: #495057; font-weight: bold; }
    #status { margin-top: 10px; font-weight: bold; font-size: 15px; text-align: center; }
    #log { background: #fafafa; border: 1px solid #e1e4e8; border-radius: 6px; height: 140px; overflow-y: auto; padding: 10px; margin-top: 8px; white-space: pre-wrap; font-size: 14px; line-height: 1.5; }
    .btn-group { display: flex; gap: 8px; }
    .btn-group button { flex: 1; }
    .guidance { font-size: 12px; color: #666; margin-top: 5px; line-height: 1.4; }

    /* 録音中インジケーター（マイク競合を起こさないCSSアニメーション） */
    .pulse-container { display: flex; justify-content: center; align-items: center; height: 20px; margin-top: 10px; }
    .pulse-dot { width: 12px; height: 12px; background-color: #ccc; border-radius: 50%; transition: 0.3s; }
    .pulse-dot.active { background-color: #28a745; transform: scale(1.3); box-shadow: 0 0 8px rgba(40,167,69,0.6); }
  </style>
</head>
<body>

  <h2 style="text-align: center; margin: 5px 0 15px;">🎙️ 会議マイク端末</h2>

  <!-- 会議・参加者設定 -->
  <div class="card">
    <label><strong>会議タイトル:</strong></label>
    <input type="text" id="meetingName" readonly>

    <label style="margin-top: 10px; display:block;"><strong>あなたの氏名（必須）:</strong></label>
    <input type="text" id="userName" placeholder="例: 山田 太郎">
    <div class="guidance">※入力後、「録音開始」を押して自分の席の前に置いてください。</div>
  </div>

  <!-- 操作部 -->
  <div class="card">
    <button id="recordBtn" class="btn-start" onclick="toggleRecording()">録音開始</button>
    <div id="controlGroup" class="btn-group" style="display: none;">
      <button id="pauseBtn" class="btn-pause" onclick="togglePause()">一時停止</button>
      <button class="btn-stop" onclick="stopRecording()">マイク停止</button>
    </div>

    <!-- 録音動作可視化インジケーター -->
    <div class="pulse-container">
      <div id="pulseDot" class="pulse-dot"></div>
    </div>

    <div id="status">待機中</div>
    
    <label style="margin-top: 12px; display:block; font-size: 13px;"><strong>あなたの音声認識プレビュー:</strong></label>
    <div id="log">話した内容がここに表示されます...</div>
  </div>

  <script>
    let recognition = null;
    let isRecording = false;
    let isPaused = false;
    let wakeLock = null;
    let targetGasUrl = "";
    let authToken = "";

    // バッファ ＆ タイマー
    let textBuffer = [];
    let silenceTimer = null;
    let heartbeatTimer = null;
    let pendingRetryQueue = [];

    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const qGas = urlParams.get('gas');
      const qToken = urlParams.get('token');
      const qMeeting = urlParams.get('meeting');

      if (qGas) localStorage.setItem('target_gas_url', qGas);
      if (qToken) localStorage.setItem('auth_token', qToken);

      targetGasUrl = localStorage.getItem('target_gas_url') || "";
      authToken = localStorage.getItem('auth_token') || "";

      if (qMeeting) {
        document.getElementById('meetingName').value = decodeURIComponent(qMeeting);
      } else {
        document.getElementById('meetingName').value = "通常会議";
      }

      const savedUser = localStorage.getItem('meeting_user_name');
      if (savedUser) document.getElementById('userName').value = savedUser;
    };

    document.getElementById('userName').addEventListener('input', (e) => {
      localStorage.setItem('meeting_user_name', e.target.value);
    });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      alert("非対応ブラウザです。iPhoneはSafari、Android・PCはGoogle Chromeをご利用ください。");
    } else {
      setupSpeechRecognition();
    }

    function setupSpeechRecognition() {
      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = true;
      recognition.interimResults = false;

      recognition.onresult = function(event) {
        if (isPaused) return;

        // 認識発火を視覚的に通知
        const dot = document.getElementById('pulseDot');
        dot.classList.add('active');
        setTimeout(() => dot.classList.remove('active'), 500);

        const currentResult = event.results[event.results.length - 1];
        if (currentResult && currentResult[0]) {
          const transcript = currentResult[0].transcript.trim();
          if (transcript.length > 0) {
            const logDiv = document.getElementById('log');
            logDiv.textContent += transcript + " ";
            logDiv.scrollTop = logDiv.scrollHeight;

            textBuffer.push(transcript);

            clearTimeout(silenceTimer);
            silenceTimer = setTimeout(() => {
              flushBuffer();
            }, 2500);
          }
        }
      };

      recognition.onerror = function(event) {
        console.warn("音声認識イベントエラー:", event.error);
        if (event.error === 'not-allowed') {
          alert("マイクの使用が拒否されています。ブラウザ設定でマイクを許可してください。");
          stopRecording();
        }
      };

      recognition.onend = function() {
        if (isRecording && !isPaused) {
          // Android Chromeのセッション遮断対策: 300ms待機後に再接続
          setTimeout(() => {
            if (isRecording && !isPaused) {
              try {
                recognition.start();
              } catch(e) {
                console.error("再接続待機中:", e);
              }
            }
          }, 300);
        }
      };
    }

    function formatIntelligentSentence(words) {
      return words.map(w => {
        w = w.trim();
        if (/(です|ます|でした|ました|だ|である|でしょうか|ね|よ|ぞ)$/.test(w) || /[。！？]$/.test(w)) {
          return w.replace(/[。！？]?$/, '。');
        }
        return w + '、';
      }).join('').replace(/、$/, '。');
    }

    function flushBuffer() {
      if (textBuffer.length === 0 && pendingRetryQueue.length === 0) return;

      let combinedText = "";
      if (textBuffer.length > 0) {
        combinedText = formatIntelligentSentence(textBuffer);
        textBuffer = [];
      }

      if (pendingRetryQueue.length > 0) {
        combinedText = pendingRetryQueue.join(' ') + ' ' + combinedText;
        pendingRetryQueue = [];
      }

      const meeting = document.getElementById('meetingName').value;
      const user = document.getElementById('userName').value || '匿名参加者';
      const status = document.getElementById('status');

      fetch(targetGasUrl, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({
          token: authToken,
          meetingName: meeting,
          userName: user,
          text: combinedText,
          type: 'speech'
        })
      })
      .then(() => {
        status.innerHTML = "<span style='color:green;'>● 録音中（送信完了）</span>";
      })
      .catch((err) => {
        pendingRetryQueue.push(combinedText);
        status.innerHTML = "<span style='color:orange;'>● 一時保存中（再送待ち）</span>";
      });
    }

    function sendHeartbeat() {
      if (!isRecording || isPaused) return;
      const user = document.getElementById('userName').value || '匿名参加者';

      fetch(targetGasUrl, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({
          token: authToken,
          userName: user,
          type: 'heartbeat'
        })
      }).catch(()=>{});

      if (pendingRetryQueue.length > 0) {
        flushBuffer();
      }
    }

    async function toggleRecording() {
      const user = document.getElementById('userName').value.trim();
      if (!user) {
        alert("あなたの「氏名」を入力してください。");
        return;
      }
      if (!targetGasUrl) {
        alert("接続先情報がありません。QRコードを再読み取りしてください。");
        return;
      }

      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen').catch(()=>{});
        }

        isRecording = true;
        isPaused = false;
        recognition.start();

        heartbeatTimer = setInterval(sendHeartbeat, 25000);
        sendHeartbeat();

        document.getElementById('recordBtn').style.display = 'none';
        document.getElementById('controlGroup').style.display = 'flex';
        document.getElementById('status').innerHTML = "<span style='color:green;'>● 録音中...</span>";
        document.getElementById('log').textContent = "";
        document.getElementById('pulseDot').classList.add('active');
      } catch(e) {
        isRecording = false;
        alert("音声認識の起動に失敗しました: " + e.message);
      }
    }

    function togglePause() {
      const btn = document.getElementById('pauseBtn');
      if (!isPaused) {
        isPaused = true;
        recognition.stop();
        flushBuffer();
        btn.innerText = "再開";
        btn.className = "btn-start";
        document.getElementById('status').innerText = "⏸️ 一時停止中";
        document.getElementById('pulseDot').classList.remove('active');
      } else {
        isPaused = false;
        recognition.start();
        btn.innerText = "一時停止";
        btn.className = "btn-pause";
        document.getElementById('status').innerHTML = "<span style='color:green;'>● 録音中...</span>";
        document.getElementById('pulseDot').classList.add('active');
      }
    }

    function stopRecording() {
      isRecording = false;
      isPaused = false;
      if (recognition) recognition.stop();
      flushBuffer();

      if (wakeLock) { wakeLock.release().catch(()=>{}); wakeLock = null; }
      if (heartbeatTimer) clearInterval(heartbeatTimer);

      document.getElementById('controlGroup').style.display = 'none';
      document.getElementById('recordBtn').style.display = 'block';
      document.getElementById('status').innerText = "停止中";
      document.getElementById('pulseDot').classList.remove('active');
    }
  </script>
</body>
</html>
