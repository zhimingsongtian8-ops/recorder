<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>議事録音声レコーダー</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; max-width: 500px; margin: auto; background: #f4f6f8; }
    .card { border-radius: 12px; padding: 16px; margin-bottom: 15px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
    button { padding: 16px; font-size: 18px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; }
    .btn-start { background-color: #28a745; color: white; }
    .btn-stop { background-color: #dc3545; color: white; }
    input[type="text"] { width: 100%; padding: 12px; box-sizing: border-box; margin-top: 6px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
    #status { margin-top: 12px; font-weight: bold; font-size: 16px; text-align: center; }
    #log { background: #fafafa; border: 1px solid #e1e4e8; border-radius: 6px; height: 180px; overflow-y: auto; padding: 10px; margin-top: 10px; white-space: pre-wrap; font-size: 14px; line-height: 1.5; }
    .config-label { font-size: 12px; color: #666; margin-top: 8px; display: block; }
  </style>
</head>
<body>

  <h2 style="text-align: center; margin-top: 5px;">🎙️ 議事録レコーダー</h2>

  <!-- 端末・接続設定 -->
  <div class="card">
    <label><strong>端末名（この端末の識別名）:</strong></label>
    <input type="text" id="deviceName" placeholder="例: 大阪第1会議室、山田スマホ">
    
    <small class="config-label">※接続先シート（QR読み取りで自動設定）:</small>
    <input type="text" id="gasUrlInput" style="font-size: 11px; padding: 6px; background: #eee;" readonly>
  </div>

  <!-- 操作部 -->
  <div class="card">
    <button id="recordBtn" class="btn-start" onclick="toggleRecording()">録音開始</button>
    <div id="status">待機中</div>
    
    <label style="margin-top: 15px; display:block; font-size: 14px;"><strong>認識プレビュー:</strong></label>
    <div id="log">話した内容がここに表示されます...</div>
  </div>

  <script>
    let recognition;
    let isRecording = false;
    let wakeLock = null;

    // 起動時の初期化
    window.onload = function() {
      // QRコードに含まれるパラメータ（?gas=...）から接続先URLを取得
      const urlParams = new URLSearchParams(window.location.search);
      const queryGasUrl = urlParams.get('gas');

      if (queryGasUrl) {
        localStorage.setItem('target_gas_url', queryGasUrl);
        document.getElementById('gasUrlInput').value = queryGasUrl;
      } else {
        const savedUrl = localStorage.getItem('target_gas_url');
        if (savedUrl) document.getElementById('gasUrlInput').value = savedUrl;
      }

      // 端末名の復元
      const savedDevice = localStorage.getItem('meeting_device_name');
      if (savedDevice) document.getElementById('deviceName').value = savedDevice;
    };

    document.getElementById('deviceName').addEventListener('input', (e) => {
      localStorage.setItem('meeting_device_name', e.target.value);
    });

    // 音声認識（Web Speech API）
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      alert("非対応ブラウザです。iPhoneはSafari、Android・PCはGoogle Chromeをご利用ください。");
    } else {
      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = true;
      recognition.interimResults = false;

      recognition.onresult = function(event) {
        const lastResultIndex = event.results.length - 1;
        const transcript = event.results[lastResultIndex][0].transcript.trim();

        if (transcript.length > 0) {
          const logDiv = document.getElementById('log');
          logDiv.textContent += transcript + "\n";
          logDiv.scrollTop = logDiv.scrollHeight;

          sendToSpreadsheet(transcript);
        }
      };

      recognition.onerror = function(event) {
        if (event.error !== 'no-speech') console.log("Notice:", event.error);
      };

      // 無音等で切断されても録音中フラグがあれば自動再接続
      recognition.onend = function() {
        if (isRecording) {
          setTimeout(() => {
            try { if (isRecording) recognition.start(); } catch(e){}
          }, 200);
        }
      };
    }

    // スプレッドシート送信処理
    function sendToSpreadsheet(text) {
      const targetUrl = document.getElementById('gasUrlInput').value.trim();
      const deviceName = document.getElementById('deviceName').value || '未設定端末';
      const status = document.getElementById('status');

      if (!targetUrl) {
        status.innerHTML = "<span style='color:red;'>接続先シートが未設定です</span>";
        return;
      }

      fetch(targetUrl, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ deviceName: deviceName, text: text })
      })
      .then(() => {
        status.innerHTML = "<span style='color:green;'>● 録音中（SS記録完了）</span>";
      })
      .catch((err) => {
        status.innerHTML = "<span style='color:red;'>● SS記録失敗</span>";
      });
    }

    // 録音開始・停止
    async function toggleRecording() {
      const btn = document.getElementById('recordBtn');
      const status = document.getElementById('status');
      const targetUrl = document.getElementById('gasUrlInput').value.trim();

      if (!isRecording) {
        if (!targetUrl) {
          alert("スプレッドシートの接続情報がありません。シートのQRコードを再度読み取ってください。");
          return;
        }

        try {
          await navigator.mediaDevices.getUserMedia({ audio: true });

          // スマホの画面消灯（スリープ）を防止
          if ('wakeLock' in navigator) {
            try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e){}
          }

          recognition.start();
          isRecording = true;
          btn.className = "btn-stop";
          btn.innerText = "録音停止";
          status.innerHTML = "<span style='color:green;'>● 録音中...</span>";
          document.getElementById('log').textContent = "";
        } catch(e) {
          alert("マイクの使用が許可されませんでした。");
        }
      } else {
        isRecording = false;
        recognition.stop();
        if (wakeLock) { wakeLock.release(); wakeLock = null; }
        btn.className = "btn-start";
        btn.innerText = "録音開始";
        status.innerText = "停止中";
      }
    }
  </script>
</body>
</html>
